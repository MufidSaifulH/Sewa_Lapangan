<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c62828">
  <title>Pemesanan | DioFid Arena</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="../assets/css/portal.css">
  <script src="js/layout.js" defer></script>
  <script src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/booking-store.js" defer></script>
  <script src="js/bookings.js" defer></script>
</head>
<body data-page="admin" data-admin-page="bookings">
  <div class="layout">
    <aside class="sidebar" data-admin-sidebar aria-label="Navigasi admin"></aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">Menu utama <span aria-hidden="true">/</span> <strong data-admin-current-title>Pemesanan</strong></div>
        <div class="topbar-right">
          <span class="today" data-admin-today></span>
          <span class="notification" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path></svg>
          </span>
        </div>
      </header>

      <div class="content">
        <section class="page-heading" aria-labelledby="page-title">
          <div>
            <h1 id="page-title" data-admin-page-title>Daftar Pemesanan</h1>
            <p>Kelola dan tinjau pemesanan lapangan.</p>
          </div>
        </section>

        <section class="panel table-panel" aria-labelledby="booking-title">
          <div class="panel-heading">
            <div>
              <h2 id="booking-title">Pemesanan Terbaru</h2>
              <p>Semua pemesanan pelanggan dan status transaksinya tersimpan di browser ini.</p>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Pelanggan</th>
                  <th scope="col">Email</th>
                  <th scope="col">Lapangan</th>
                  <th scope="col">Tanggal &amp; Waktu</th>
                  <th scope="col">Total</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="booking-list"></tbody>
            </table>
          </div>
          <p class="page-message" id="booking-message" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
